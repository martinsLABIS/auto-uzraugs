name: Auto uzraugs

on:
  schedule:
    # katru stundu 6:00–22:00 pēc Rīgas laika (laiks šeit ir UTC)
    - cron: "0 4-20 * * *"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Pilna ss.com pārskatīšana (aizņem ~15 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-uzraugs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pārbaudīt sludinājumus
        run: python auto_monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_PRICE: ${{ vars.MAX_PRICE || '37000' }}
          SCAN_MAX: ${{ vars.SCAN_MAX || '40000' }}
          INCLUDE_EV: ${{ vars.INCLUDE_EV || '0' }}
          DEBUG: ${{ vars.DEBUG || '0' }}
          FULL_SCAN: ${{ inputs.full_scan && '1' || '0' }}

      - name: Saglabāt stāvokli
        run: |
          git config user.name "auto-uzraugs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Atjaunināts stāvoklis" && git push)
