name: Auto uzraugs

on:
  schedule:
    # katru stundu (:17) 6:00–22:00 pēc Rīgas laika (laiks šeit ir UTC); pilnā stunda ir GitHub noslogotākais brīdis
    - cron: "17 4-20 * * *"
    - cron: "*/10 21-22 * * *"   # PAGAIDU tests – vai GitHub grafiks vispār darbojas
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Pilna ss.com pārskatīšana (aizņem ~15 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-uzraugs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pārbaudīt sludinājumus
        run: python -m finder.run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG: ${{ vars.DEBUG || '0' }}
          FULL_SCAN: ${{ inputs.full_scan && '1' || '0' }}

      - name: Saglabāt stāvokli
        run: |
          git config user.name "auto-uzraugs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finder_state.json docs/data2.json
          git diff --cached --quiet && exit 0
          git commit -m "Atjaunināts stāvoklis"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs && continue
            sleep 5
          done
          exit 1
