<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plug-in 4x4</title>
<meta name="description" content="Plug-in hibrīdi ar pilnpiedziņu no ss.com un Moller Auto">
<meta name="theme-color" content="#0b6e68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plug-in 4x4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #edf0ee;
  --surface: #ffffff;
  --ink: #16232b;
  --muted: #5e6b72;
  --line: #d5dcd9;
  --charge: #0b6e68;
  --charge-soft: #dcefec;
  --drop: #a64b08;
  --drop-soft: #f8e6d6;
  --new: #2457a6;
  --new-soft: #e0e8f6;
  --font: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f171b;
    --surface: #182328;
    --ink: #e6ecea;
    --muted: #96a4aa;
    --line: #2a383e;
    --charge: #4cc2b8;
    --charge-soft: #173a38;
    --drop: #f0a050;
    --drop-soft: #3a2a1a;
    --new: #8fb2ee;
    --new-soft: #1d2b44;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.4 var(--font);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--surface);
  z-index: 10;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding-top: 14px;
}
h1 {
  margin: 0;
  font-size: 30px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -0.01em;
}
h1 .plug { color: var(--charge); }
.status { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.refresh {
  flex: none;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font: 500 15px var(--font);
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
}
.refresh[aria-busy="true"] { opacity: .5; }

.views {
  display: flex;
  gap: 4px;
  margin: 12px 0 10px;
  padding: 3px;
  background: var(--bg);
  border-radius: 10px;
}
.views button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: 500 16px var(--font);
  padding: 7px 4px;
  border-radius: 8px;
  cursor: pointer;
}
.views button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgb(0 0 0 / .12);
}
.views .n { color: var(--muted); font-weight: 400; margin-left: 2px; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  padding-bottom: 12px;
}
.controls select {
  font: 500 15px var(--font);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 8px;
}
.controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); }
.controls input { accent-color: var(--charge); width: 18px; height: 18px; margin: 0; }

main { padding: 12px 0 32px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.list li[hidden] { display: none; }

.car {
  display: grid;
  grid-template-columns: 104px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 12px 10px 10px;
  background: var(--surface);
  border-radius: 12px;
  color: inherit;
  text-decoration: none;
  border: 1px solid var(--line);
}
.car:active { transform: scale(.99); }
.car:focus-visible { outline: 3px solid var(--charge); outline-offset: 2px; }
.thumb {
  width: 104px;
  aspect-ratio: 4 / 3;
  border-radius: 8px;
  object-fit: cover;
  background: var(--bg);
  display: block;
}
.thumb.empty { display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.info { min-width: 0; }
.name {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.meta { margin: 3px 0 0; color: var(--muted); font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag {
  font-size: 13px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
}
.tag.new { background: var(--new-soft); color: var(--new); }
.tag.drop { background: var(--drop-soft); color: var(--drop); }
.tag.over { background: transparent; border: 1px dashed var(--line); }

.price { text-align: right; align-self: start; padding-top: 2px; }
.price .now {
  display: block;
  font-size: 24px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  white-space: nowrap;
}
.price .was {
  display: block;
  margin-top: 4px;
  font-size: 14px;
  color: var(--muted);
  text-decoration: line-through;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.price .diff {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--drop);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

@media (max-width: 420px) {
  .car { grid-template-columns: 84px 1fr; grid-template-areas: "img info" "img price"; row-gap: 6px; }
  .thumb { width: 84px; grid-area: img; align-self: start; }
  .info { grid-area: info; }
  .price { grid-area: price; text-align: left; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .price .now { font-size: 22px; }
  .price .was, .price .diff { margin-top: 0; }
}

.empty-state, .error {
  padding: 32px 16px;
  text-align: center;
  color: var(--muted);
}
.error { color: var(--drop); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
footer { color: var(--muted); font-size: 14px; padding-bottom: 24px; }
@media (prefers-reduced-motion: reduce) { .car:active { transform: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1><span class="plug">Plug-in</span> 4x4</h1>
        <p class="status" id="status">Ielādē…</p>
      </div>
      <button class="refresh" id="refresh" type="button">Atjaunot</button>
    </div>
    <div class="views" role="group" aria-label="Rādīt">
      <button type="button" data-view="all" aria-pressed="true">Visi <span class="n" id="n-all"></span></button>
      <button type="button" data-view="new" aria-pressed="false">Jauni <span class="n" id="n-new"></span></button>
      <button type="button" data-view="drop" aria-pressed="false">Lētāki <span class="n" id="n-drop"></span></button>
    </div>
    <div class="controls">
      <select id="sort" aria-label="Kārtot">
        <option value="price">Lētākie vispirms</option>
        <option value="seen">Jaunākie sludinājumi</option>
        <option value="year">Jaunākais gads</option>
        <option value="km">Mazākais nobraukums</option>
      </select>
      <select id="source" aria-label="Avots">
        <option value="">Visi avoti</option>
        <option value="SS">ss.com</option>
        <option value="Moller">Moller Auto</option>
      </select>
      <label><input type="checkbox" id="over"> <span id="over-label">Arī virs robežas</span></label>
    </div>
  </div>
</header>

<main class="wrap">
  <ul class="list" id="list"></ul>
  <p class="empty-state" id="empty" hidden>Šajā skatā nav neviena auto.</p>
  <p class="error" id="error" hidden></p>
  <p class="sr-only" id="announce" aria-live="polite"></p>
</main>
<footer class="wrap" id="footer"></footer>

<script>
(() => {
  const NEW_DAYS = 3;      // cik dienas auto skaitās "jauns"
  const DROP_DAYS = 14;    // cik dienas rāda cenas kritumu
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString("lv-LV").replace(/,/g, " ") + " €";
  const fmtKm = (n) => Math.round(n / 1000).toLocaleString("lv-LV") + " tūkst. km";
  const state = { view: "all", sort: "price", source: "", over: false };
  let data = null;
  let baseline = 0;   // agrākais atklāšanas laiks – pirmās pārskatīšanas brīdis
  const nodes = new Map();   // id -> <li>, lai kārtojot pārvietotu esošos elementus

  try {
    Object.assign(state, JSON.parse(localStorage.getItem("plugin4x4") || "{}"));
  } catch (e) { /* krātuve nav pieejama */ }
  const save = () => { try { localStorage.setItem("plugin4x4", JSON.stringify(state)); } catch (e) {} };

  const daysAgo = (iso) => iso ? (Date.now() - Date.parse(iso)) / 86400000 : Infinity;

  function enrich(c) {
    const h = c.history || [];
    let prev = null, dropDate = null;
    for (let i = h.length - 1; i > 0; i--) {
      if (h[i][1] < h[i - 1][1]) { prev = h[i - 1][1]; dropDate = h[i][0]; break; }
    }
    // auto, kas atrasti jau pirmajā pārskatīšanā, nav "jauni"
    c.isNew = daysAgo(c.first_seen) <= NEW_DAYS && Date.parse(c.first_seen) - baseline > 2 * 3600000;
    c.isDrop = prev !== null && c.price < prev && daysAgo(dropDate) <= DROP_DAYS;
    c.prev = prev;
    c.over = c.price > data.max_price;
    return c;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function card(c) {
    const li = document.createElement("li");
    const a = el("a", "car");
    a.href = c.url;
    a.target = "_blank";
    a.rel = "noopener";

    if (c.img) {
      const img = el("img", "thumb");
      img.src = c.img;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";
      img.onerror = () => img.replaceWith(el("span", "thumb empty", "Nav foto"));
      a.append(img);
    } else {
      a.append(el("span", "thumb empty", "Nav foto"));
    }

    const info = el("div", "info");
    info.append(el("h2", "name", c.title));
    const meta = [c.year, c.km ? fmtKm(+c.km) : ""].filter(Boolean).join(", ");
    if (meta) info.append(el("p", "meta", meta));
    const tags = el("div", "tags");
    tags.append(el("span", "tag", c.source === "SS" ? "ss.com" : "Moller Auto"));
    if (c.isNew) tags.append(el("span", "tag new", "Jauns"));
    if (c.isDrop) tags.append(el("span", "tag drop", "Lētāks"));
    if (c.over) tags.append(el("span", "tag over", "Virs robežas"));
    info.append(tags);
    a.append(info);

    const price = el("div", "price");
    price.append(el("span", "now", fmt(c.price)));
    if (c.isDrop) {
      price.append(el("span", "was", fmt(c.prev)));
      price.append(el("span", "diff", "−" + fmt(c.prev - c.price)));
    }
    a.append(price);
    li.append(a);
    return li;
  }

  const sorters = {
    price: (a, b) => a.price - b.price,
    seen: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || ""),
    year: (a, b) => (+b.year || 0) - (+a.year || 0) || a.price - b.price,
    km: (a, b) => (+a.km || 9e9) - (+b.km || 9e9),
  };

  function visible(c) {
    if (!state.over && c.over) return false;
    if (state.source && c.source !== state.source) return false;
    if (state.view === "new" && !c.isNew) return false;
    if (state.view === "drop" && !c.isDrop) return false;
    return true;
  }

  function apply(announce) {
    if (!data) return;
    const list = $("list");
    const cars = [...data.cars].sort(sorters[state.sort] || sorters.price);
    let shown = 0;
    for (const c of cars) {
      const li = nodes.get(c.id);
      li.hidden = !visible(c);
      if (!li.hidden) shown++;
      list.append(li);   // pārvieto esošo elementu, neveido no jauna
    }
    const base = data.cars.filter((c) => (state.over || !c.over) && (!state.source || c.source === state.source));
    $("n-all").textContent = base.length;
    $("n-new").textContent = base.filter((c) => c.isNew).length;
    $("n-drop").textContent = base.filter((c) => c.isDrop).length;
    $("empty").hidden = shown > 0;
    document.querySelectorAll(".views button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    $("sort").value = state.sort;
    $("source").value = state.source;
    $("over").checked = state.over;
    if (announce) $("announce").textContent = shown + " auto";
    save();
  }

  function timeLabel(iso) {
    const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (min < 1) return "tikko";
    if (min < 60) return `pirms ${min} min`;
    const h = Math.round(min / 60);
    if (h < 24) return `pirms ${h} h`;
    return new Date(iso).toLocaleDateString("lv-LV");
  }

  async function load() {
    const btn = $("refresh");
    btn.setAttribute("aria-busy", "true");
    try {
      const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      data = await r.json();
      baseline = Math.min(...data.cars.map((c) => Date.parse(c.first_seen) || Infinity));
      data.cars.forEach(enrich);
      const list = $("list");
      list.replaceChildren();
      nodes.clear();
      for (const c of data.cars) nodes.set(c.id, card(c));
      const inLimit = data.cars.filter((c) => !c.over).length;
      $("status").textContent = `${inLimit} auto līdz ${fmt(data.max_price)}. Atjaunināts ${timeLabel(data.updated)}.`;
      $("over-label").textContent = `Arī ${Math.round(data.max_price / 1000)}–${Math.round(data.scan_max / 1000)} tūkst. €`;
      $("footer").textContent = "Saraksts atjaunojas reizi stundā no 6:00 līdz 22:00. Pieskaries auto, lai atvērtu sludinājumu.";
      $("error").hidden = true;
      apply(false);
    } catch (e) {
      $("error").hidden = false;
      $("error").textContent = "Sarakstu neizdevās ielādēt. Pārbaudi interneta savienojumu un nospied „Atjaunot”.";
      $("status").textContent = "Nav datu";
    } finally {
      btn.removeAttribute("aria-busy");
    }
  }

  document.querySelectorAll(".views button").forEach((b) =>
    b.addEventListener("click", () => { state.view = b.dataset.view; apply(true); }));
  $("sort").addEventListener("change", (e) => { state.sort = e.target.value; apply(true); });
  $("source").addEventListener("change", (e) => { state.source = e.target.value; apply(true); });
  $("over").addEventListener("change", (e) => { state.over = e.target.checked; apply(true); });
  $("refresh").addEventListener("click", load);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
